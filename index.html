<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kingdoms of the Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0D0D15;
        }
        #gameCanvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* ============ TOUCH CONTROLS (mobile only) ============ */
        #touchLayer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            pointer-events: none;
            display: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        @media (pointer: coarse) {
            #touchLayer { display: block; }
        }

        .tbtn {
            pointer-events: auto;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(13, 13, 21, 0.45);
            color: rgba(255, 255, 255, 0.85);
            border-radius: 14px;
            font: bold 20px/1 monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.08s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .tbtn:active, .tbtn.pressed {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Left cluster: D-pad, anchored INSIDE the screen edge */
        #dpad {
            position: fixed;
            left: max(14px, env(safe-area-inset-left));
            bottom: max(16px, env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 56px);
            gap: 6px;
        }
        #dpad .up    { grid-area: 1 / 2; }
        #dpad .left  { grid-area: 2 / 1; }
        #dpad .right { grid-area: 2 / 3; }
        #dpad .down  { grid-area: 3 / 2; }

        /* Right cluster: action buttons, anchored INSIDE the screen edge */
        #actions {
            position: fixed;
            right: max(14px, env(safe-area-inset-right));
            bottom: max(16px, env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(2, 66px);
            grid-auto-rows: 62px;
            gap: 8px;
            align-items: end;
        }
        #actions .z   { width: 82px; height: 82px; border-radius: 50%; font-size: 26px; }
        #actions .x   { font-size: 22px; }
        #actions .run { font-size: 13px; }
        #actions .ok  { font-size: 15px; }

        /* Top-right: pause / fullscreen */
        #topbtns {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            display: flex;
            gap: 10px;
        }
        #topbtns .tbtn {
            width: 44px;
            height: 40px;
            font-size: 16px;
        }

        /* Rotate hint (portrait phones) */
        #rotateHint {
            position: fixed;
            inset: 0;
            z-index: 1001;
            background: rgba(13, 13, 21, 0.92);
            color: #fff;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            font: bold 17px/1.4 monospace;
            padding: 0 30px;
        }
        #rotateHint .icon {
            font-size: 52px;
            animation: rot 1.6s ease-in-out infinite;
        }
        @keyframes rot {
            0%, 40% { transform: rotate(0deg); }
            60%, 100% { transform: rotate(90deg); }
        }
        @media (pointer: coarse) and (orientation: portrait) {
            #rotateHint { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- On-screen touch controls (mobile only) -->
    <div id="touchLayer">
        <div id="dpad">
            <button class="tbtn up"    data-key="ArrowUp">&#9650;</button>
            <button class="tbtn left"  data-key="ArrowLeft">&#9664;</button>
            <button class="tbtn right" data-key="ArrowRight">&#9654;</button>
            <button class="tbtn down"  data-key="ArrowDown">&#9660;</button>
        </div>
        <div id="actions">
            <button class="tbtn ok"  data-key="Enter">OK</button>
            <button class="tbtn run" data-key="Shift">RUN</button>
            <button class="tbtn x"   data-key="x">X</button>
            <button class="tbtn z"   data-key="z">Z</button>
        </div>
        <div id="topbtns">
            <button class="tbtn pause" data-key="Escape">II</button>
            <button class="tbtn fs" id="fsBtn">&#x2217;</button>
        </div>
    </div>

    <div id="rotateHint">
        <div class="icon">&#128260;</div>
        <div>Поверните телефон горизонтально</div>
    </div>

    <!-- Engine modules -->
    <script src="src/constants.js"></script>
    <script src="src/input.js"></script>
    <script src="src/level.js"></script>
    <script src="src/physics.js"></script>
    <script src="src/camera.js"></script>
    <script src="src/renderer.js"></script>
    <script src="src/particles.js"></script>
    <script src="src/player.js"></script>

    <!-- Enemy & Boss System (Sprint 5) -->
    <script src="src/enemies.js"></script>

    <!-- Game Structure & UI (Sprint 3) -->
    <script src="src/transition.js"></script>
    <script src="src/hud.js"></script>
    <script src="src/menu.js"></script>

    <!-- World Map, Collectibles & Save (Sprint 4) -->
    <script src="src/save.js"></script>
    <script src="src/collectibles.js"></script>
    <script src="src/worldmap.js"></script>

    <!-- Audio System (Sprint 10) -->
    <script src="src/audio.js"></script>

    <script src="src/states.js"></script>
    <script src="src/game.js"></script>

    <script>
        // Scale canvas to fit window while preserving aspect ratio
        function resizeCanvas() {
            const canvas = document.getElementById('gameCanvas');
            const windowW = window.innerWidth;
            const windowH = window.innerHeight;
            const aspect = 960 / 540;
            const windowAspect = windowW / windowH;

            let cssW, cssH;
            if (windowAspect > aspect) {
                cssH = windowH;
                cssW = cssH * aspect;
            } else {
                cssW = windowW;
                cssH = cssW / aspect;
            }

            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        resizeCanvas();

        // Expose all game globals on window for test accessibility (C-27)
        window.Game = Game;
        window.GameState = GameState;
        window.Renderer = Renderer;
        window.Input = Input;
        window.Level = Level;
        window.Physics = Physics;
        window.Camera = Camera;
        window.Player = Player;
        window.Particles = Particles;
        window.Enemies = Enemies;
        window.Transition = Transition;
        window.HUD = HUD;
        window.Menu = Menu;
        window.SaveSystem = SaveSystem;
        window.Collectibles = Collectibles;
        window.WorldMap = WorldMap;
        window.AudioManager = AudioManager;

        // Start the game
        Game.init();

        /* ================= TOUCH CONTROLS LOGIC =================
           Buttons emulate real keyboard events. A single dispatch on
           document with bubbles:true reaches listeners on both
           document and window (event path: document -> window),
           so one tap = one key press, no duplicates. */

        (function () {
            // Key codes for consistency: 'z'/'x' as letters, Shift as key
            const KEY_MAP = {
                'Shift': { key: 'Shift', code: 'ShiftLeft' },
                'Escape': { key: 'Escape', code: 'Escape' },
                'Enter': { key: 'Enter', code: 'Enter' },
                'ArrowUp': { key: 'ArrowUp', code: 'ArrowUp' },
                'ArrowDown': { key: 'ArrowDown', code: 'ArrowDown' },
                'ArrowLeft': { key: 'ArrowLeft', code: 'ArrowLeft' },
                'ArrowRight': { key: 'ArrowRight', code: 'ArrowRight' },
                'z': { key: 'z', code: 'KeyZ' },
                'x': { key: 'x', code: 'KeyX' }
            };

            const pressed = new Set(); // currently held logical keys

            function send(type, name, btn) {
                const m = KEY_MAP[name] || { key: name, code: name };
                const ev = new KeyboardEvent(type, {
                    key: m.key,
                    code: m.code,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(ev);
                if (btn) btn.classList.toggle('pressed', type === 'keydown');
            }

            function press(btn) {
                const name = btn.dataset.key;
                if (pressed.has(name)) return;      // block auto-repeat & multi-finger ghosting
                pressed.add(name);
                send('keydown', name, btn);
            }

            function release(btn) {
                const name = btn.dataset.key;
                if (!pressed.delete(name)) return;
                send('keyup', name, btn);
            }

            document.querySelectorAll('#touchLayer .tbtn[data-key]').forEach(btn => {
                const name = btn.dataset.key;
                // Pointer events cover touch + stylus uniformly
                btn.addEventListener('pointerdown', e => {
                    e.preventDefault();
                    btn.setPointerCapture(e.pointerId);
                    press(btn);
                });
                btn.addEventListener('pointerup', e => {
                    e.preventDefault();
                    release(btn);
                });
                btn.addEventListener('pointercancel', () => release(btn));
                btn.addEventListener('lostpointercapture', () => release(btn));
                // Safety: sliding a finger off the button releases the key
                btn.addEventListener('pointerleave', e => { if (e.pointerType === 'touch') release(btn); });
                btn.addEventListener('contextmenu', e => e.preventDefault());
            });

            // Safety net: if the tab loses focus while a key is held, release all
            window.addEventListener('blur', () => {
                pressed.forEach(name => {
                    const btn = document.querySelector('.tbtn[data-key="' + name + '"]');
                    if (btn) release(btn);
                });
            });

            // Fullscreen + landscape lock attempt (best effort per browser)
            document.getElementById('fsBtn').addEventListener('pointerdown', e => {
                e.preventDefault();
                const el = document.documentElement;
                if (!document.fullscreenElement) {
                    const p = el.requestFullscreen ? el.requestFullscreen() : Promise.resolve();
                    Promise.resolve(p).then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {});
                        }
                    }).catch(() => {});
                } else if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            });
        })();
    </script>
</body>
</html>
