<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kingdoms of the Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0D0D15;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameCanvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* ===== Mobile touch controls (touch devices only) ===== */
        #tc-root {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            pointer-events: none;
            font-family: Arial, sans-serif;
        }
        #tc-root.on { display: block; }

        .tc-btn {
            position: absolute;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.32);
            border: 2px solid rgba(255, 255, 255, 0.30);
            color: rgba(255, 255, 255, 0.80);
            font-weight: bold;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .tc-btn.pressed {
            background: rgba(255, 255, 255, 0.38);
            color: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.70);
        }

        /* Left: compact D-pad at the bottom-left corner, inside the screen */
        .tc-left  { width: 56px; height: 56px; left:  calc(10px + env(safe-area-inset-left, 0px));  bottom: calc(66px  + env(safe-area-inset-bottom, 0px)); font-size: 20px; }
        .tc-right { width: 56px; height: 56px; left:  calc(86px + env(safe-area-inset-left, 0px));  bottom: calc(66px  + env(safe-area-inset-bottom, 0px)); font-size: 20px; }
        .tc-up    { width: 48px; height: 48px; left:  calc(52px + env(safe-area-inset-left, 0px));  bottom: calc(126px + env(safe-area-inset-bottom, 0px)); font-size: 18px; }
        .tc-down  { width: 48px; height: 48px; left:  calc(52px + env(safe-area-inset-left, 0px));  bottom: calc(10px  + env(safe-area-inset-bottom, 0px)); font-size: 18px; }

        /* Right: action buttons, each with a clear 12px+ gap from neighbours */
        .tc-jump { width: 78px; height: 78px; right: calc(12px  + env(safe-area-inset-right, 0px)); bottom: calc(14px  + env(safe-area-inset-bottom, 0px)); font-size: 28px; background: rgba(90, 200, 255, 0.22); border-color: rgba(90, 200, 255, 0.55); }
        .tc-atk  { width: 58px; height: 58px; right: calc(102px + env(safe-area-inset-right, 0px)); bottom: calc(12px  + env(safe-area-inset-bottom, 0px)); font-size: 20px; background: rgba(255, 120, 90, 0.20); border-color: rgba(255, 120, 90, 0.55); }
        .tc-run  { width: 50px; height: 50px; right: calc(24px  + env(safe-area-inset-right, 0px)); bottom: calc(106px + env(safe-area-inset-bottom, 0px)); font-size: 11px; }
        .tc-ok   { width: 50px; height: 50px; right: calc(108px + env(safe-area-inset-right, 0px)); bottom: calc(96px  + env(safe-area-inset-bottom, 0px)); font-size: 11px; }

        /* Top-right: pause + fullscreen */
        .tc-pause { width: 44px; height: 44px; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); font-size: 16px; }
        .tc-full  { width: 44px; height: 44px; right: calc(64px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); font-size: 16px; }

        /* Show rotate hint only on touch devices in portrait */
        @media (orientation: portrait) {
            #tc-root.on ~ #tc-rotate { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- ===== On-screen gamepad (touch devices only) ===== -->
    <div id="tc-root">
        <div class="tc-btn tc-left"  data-key="ArrowLeft"  data-code="ArrowLeft">&#9664;</div>
        <div class="tc-btn tc-right" data-key="ArrowRight" data-code="ArrowRight">&#9654;</div>
        <div class="tc-btn tc-up"    data-key="ArrowUp"    data-code="ArrowUp">&#9650;</div>
        <div class="tc-btn tc-down"  data-key="ArrowDown"  data-code="ArrowDown">&#9660;</div>

        <div class="tc-btn tc-jump" data-key="z" data-code="KeyZ">Z</div>
        <div class="tc-btn tc-atk"  data-key="x" data-code="KeyX">X</div>
        <div class="tc-btn tc-run"  data-key="Shift" data-code="ShiftLeft">RUN</div>
        <div class="tc-btn tc-ok"   data-key="Enter" data-code="Enter">OK</div>

        <div class="tc-btn tc-pause" data-key="Escape" data-code="Escape">II</div>
        <div class="tc-btn tc-full"  id="tc-fs" data-code="">&gt;&lt;</div>
    </div>

    <div id="tc-rotate">
        <div class="icon">&#128260;</div>
        <div>Поверните телефон горизонтально</div>
    </div>

    <!-- Engine modules -->
    <script src="src/constants.js"></script>
    <script src="src/input.js"></script>
    <script src="src/level.js"></script>
    <script src="src/physics.js"></script>
    <script src="src/camera.js"></script>
    <script src="src/renderer.js"></script>
    <script src="src/particles.js"></script>
    <script src="src/player.js"></script>

    <!-- Enemy & Boss System (Sprint 5) -->
    <script src="src/enemies.js"></script>

    <!-- Game Structure & UI (Sprint 3) -->
    <script src="src/transition.js"></script>
    <script src="src/hud.js"></script>
    <script src="src/menu.js"></script>

    <!-- World Map, Collectibles & Save (Sprint 4) -->
    <script src="src/save.js"></script>
    <script src="src/collectibles.js"></script>
    <script src="src/worldmap.js"></script>

    <!-- Audio System (Sprint 10) -->
    <script src="src/audio.js"></script>

    <script src="src/states.js"></script>
    <script src="src/game.js"></script>

    <script>
        // Scale canvas to fit window while preserving aspect ratio
        function resizeCanvas() {
            const canvas = document.getElementById('gameCanvas');
            const windowW = window.innerWidth;
            const windowH = window.innerHeight;
            const aspect = 960 / 540;
            const windowAspect = windowW / windowH;

            let cssW, cssH;
            if (windowAspect > aspect) {
                cssH = windowH;
                cssW = cssH * aspect;
            } else {
                cssW = windowW;
                cssH = cssW / aspect;
            }

            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Expose all game globals on window for test accessibility (C-27)
        window.Game = Game;
        window.GameState = GameState;
        window.Renderer = Renderer;
        window.Input = Input;
        window.Level = Level;
        window.Physics = Physics;
        window.Camera = Camera;
        window.Player = Player;
        window.Particles = Particles;
        window.Enemies = Enemies;
        window.Transition = Transition;
        window.HUD = HUD;
        window.Menu = Menu;
        window.SaveSystem = SaveSystem;
        window.Collectibles = Collectibles;
        window.WorldMap = WorldMap;
        window.AudioManager = AudioManager;

        // Start the game
        Game.init();

        // ===== Touch controls layer (does not modify game code) =====
        (function () {
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            const root = document.getElementById('tc-root');
            if (!isTouch) return;
            root.classList.add('on');

            function sendKey(type, key, code) {
                const ev = new KeyboardEvent(type, {
                    key: key, code: code,
                    bubbles: true, cancelable: true
                });
                window.dispatchEvent(ev);
                document.dispatchEvent(ev);
                const c = document.getElementById('gameCanvas');
                if (c) c.dispatchEvent(ev);
            }

            // One finger = one button. Each touch is tracked by its id,
            // so a finger can never "leak" into a neighbouring button,
            // and a pressed key is released only when ITS finger lifts.
            const activeTouches = new Map(); // touch id -> button element

            function press(btn) {
                if (!btn || btn.classList.contains('pressed')) return;
                btn.classList.add('pressed');
                sendKey('keydown', btn.dataset.key, btn.dataset.code);
            }
            function release(btn) {
                if (!btn) return;
                btn.classList.remove('pressed');
                sendKey('keyup', btn.dataset.key, btn.dataset.code);
            }

            function findBtn(el) {
                while (el && el !== document.body) {
                    if (el.classList && el.classList.contains('tc-btn')) return el;
                    el = el.parentElement;
                }
                return null;
            }

            document.addEventListener('touchstart', function (e) {
                for (const t of e.changedTouches) {
                    const btn = findBtn(t.target);
                    if (btn) {
                        e.preventDefault();
                        activeTouches.set(t.identifier, btn);
                        press(btn);
                    }
                }
            }, { passive: false });

            document.addEventListener('touchmove', function (e) {
                // If a finger slides off its own button, release that key
                for (const t of e.changedTouches) {
                    const btn = activeTouches.get(t.identifier);
                    if (!btn) continue;
                    const el = document.elementFromPoint(t.clientX, t.clientY);
                    if (!el || findBtn(el) !== btn) {
                        activeTouches.delete(t.identifier);
                        release(btn);
                    }
                }
            }, { passive: false });

            function endTouch(e) {
                for (const t of e.changedTouches) {
                    const btn = activeTouches.get(t.identifier);
                    if (btn) {
                        activeTouches.delete(t.identifier);
                        release(btn);
                    }
                }
            }
            document.addEventListener('touchend', endTouch, { passive: false });
            document.addEventListener('touchcancel', endTouch, { passive: false });

            // Release everything on blur so keys never stick
            window.addEventListener('blur', function () {
                document.querySelectorAll('.tc-btn').forEach(release);
                activeTouches.clear();
            });

            // Fullscreen + landscape lock
            document.getElementById('tc-fs').addEventListener('click', function () {
                if (!document.fullscreenElement) {
                    const req = document.documentElement.requestFullscreen ||
                                document.documentElement.webkitRequestFullscreen;
                    if (req) req.call(document.documentElement);
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(function () {});
                    }
                } else {
                    document.exitFullscreen && document.exitFullscreen();
                }
            });

            // Block pinch-zoom & double-tap zoom during play
            document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function (e) {
                const now = Date.now();
                if (now - lastTouchEnd < 300) e.preventDefault();
                lastTouchEnd = now;
            }, { passive: false });
        })();
    </script>
</body>
</html>
